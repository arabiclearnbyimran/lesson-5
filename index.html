<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>মিশরীয় আরবি: فعل مضارع (ফে'ল মুদারেআ) — Lesson 5</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#192338;font-family:Arial,"Noto Sans Bengali","SolaimanLipi",sans-serif;line-height:1.65}.wrap{max-width:900px;margin:auto;padding:16px 12px 38px}header{background:#17315f;color:#fff;padding:22px;border-radius:14px;text-align:center}h1{font-size:clamp(23px,4vw,31px);line-height:1.35;margin:0}header h2{font-size:20px;margin:5px 0 0}.note{margin:14px 0;padding:13px 15px;background:#fff;border:1px solid #d9e0ec;border-radius:11px}.q{background:#fff;border:1px solid #d9e0ec;border-radius:13px;margin:13px 0;padding:16px}.qt{font-size:18px;font-weight:bold;margin:0 0 12px}.opts{display:grid;gap:8px}.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font:inherit;padding:10px 12px;background:#fff;border:1px solid #d9e0ec;border-radius:9px;cursor:pointer;color:inherit}.opt:hover:not(:disabled){border-color:#2257c7;background:#f8faff}.opt:disabled{cursor:not-allowed;opacity:.9}.opt.selected{border:2px solid #2257c7;background:#edf3ff;padding:9px 11px}.mark{flex:0 0 26px;width:26px;height:26px;border:2px solid #a5afc0;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:bold;color:#fff}.selected .mark{border-color:#2257c7;background:#2257c7}.opt.correct{border:2px solid #16804a;background:#e8f8ef}.opt.correct .mark{border-color:#16804a;background:#16804a}.opt.wrong{border:2px solid #c62828;background:#fff0f0}.opt.wrong .mark{border-color:#c62828;background:#c62828}.opttext{display:block}.feedback{margin-top:10px;padding:10px 12px;border-radius:8px;font-weight:bold}.feedback.good{color:#12683d;background:#e8f8ef}.feedback.bad{color:#a61b1b;background:#fff0f0}.actions{background:#fff;border:1px solid #d9e0ec;border-radius:15px;padding:18px;margin-top:22px}.actionbtn{display:block;width:100%;border:0;border-radius:10px;text-align:center;text-decoration:none;font:inherit;font-weight:bold;color:#fff;padding:13px 16px;margin:12px 0;cursor:pointer}.pdf{background:#2257c7}.youtube{background:#d71920}.small{font-size:13px;color:#637087}@media print{body{background:white;color:#111;font-size:11pt}.wrap{max-width:none;padding:0}header{background:white!important;color:#111!important;border:1px solid #777;padding:12px}.note,.actions{display:none!important}.q{break-inside:avoid;border:1px solid #bbb;margin:8px 0;padding:10px}.qt{font-size:13pt}.opt{padding:4px 6px;border:0;cursor:default}.opt.selected{border:0;background:white;padding:4px 6px}.mark{width:18px;height:18px;flex-basis:18px;border:1px solid #555;color:#111;font-size:10pt}.selected .mark{background:white;color:#111;border:1px solid #111}}</style></head><body><div class="wrap"><header><h1>মিশরীয় আরবি: فعل مضارع (ফে'ল মুদারেআ)</h1><h2>Lesson 5</h2></header><div class="note">প্রতিটি প্রশ্নে একটি উত্তর নির্বাচন করুন। উত্তর নির্বাচন করলে সঙ্গে সঙ্গে সঠিক/ভুল দেখানো হবে।</div><main id="quiz"></main><section class="actions"><p>PDF তৈরি / প্রিন্ট করার জন্য নিচের PDF বাটনে চাপ দিন, তারপর Print dialog-এ “Save as PDF” নির্বাচন করুন।</p><button class="actionbtn pdf" type="button" onclick="window.print()">PDF তৈরি / প্রিন্ট</button><a class="actionbtn youtube" href="https://www.youtube.com/@imranazhary" target="_blank" rel="noopener noreferrer">My YouTube Channel</a></section></div><script>
const questions = [{"q": "فعل مضارع (ফে'ল মুদারেআ) কোন সময়ের কাজ বোঝাতে পারে?", "opts": ["বর্তমান বা ভবিষ্যতের কাজ", "শুধু অতীতের কাজ", "শুধু আদেশ", "শুধু প্রশ্ন"], "correct": 0}, {"q": "অনেক সাধারণ মিশরীয় আরবি ক্রিয়ার বর্তমানকাল গঠনে শুরুতে কোন অংশটি যোগ হয়?", "opts": ["ما", "بـ", "ش", "هـ"], "correct": 1}, {"q": "পাঠ অনুযায়ী, بـ যোগ করার নিয়ম সম্পর্কে কোন কথাটি সঠিক?", "opts": ["সব ক্রিয়ায় একই নিয়ম চলে", "এটি শুধু অতীতকালে লাগে", "অনেক সাধারণ ক্রিয়ায় লাগে, তবে সব ক্ষেত্রে নয়", "এটি শুধু প্রশ্নে লাগে"], "correct": 2}, {"q": "أنا بروح বাক্যটির অর্থ কী?", "opts": ["আমি বুঝি", "আমি লিখি", "আমি ঘুমাই", "আমি যাই"], "correct": 3}, {"q": "أنا بشوف বাক্যটির বাংলা অর্থ কী?", "opts": ["আমি দেখি", "আমি বলি", "আমি নিই", "আমি পান করি"], "correct": 0}, {"q": "أنا باخد বাক্যটির অর্থ কী?", "opts": ["আমি শিখি", "আমি নিই", "আমি কাজ করি", "আমি পড়ি"], "correct": 1}, {"q": "أنا بعمل বাক্যটির অর্থ কী?", "opts": ["আমি আসি", "আমি খাই", "আমি করি", "আমি ঘুমাই"], "correct": 2}, {"q": "أنا بكتب বাক্যটির বাংলা অর্থ কী?", "opts": ["আমি দেখি", "আমি যাই", "আমি কথা বলি", "আমি লিখি"], "correct": 3}, {"q": "أنا بفهم كلامك বাক্যটির অর্থ কী?", "opts": ["আমি তোমার কথা বুঝি", "আমি তোমার জন্য অপেক্ষা করি", "আমি তোমার কথা লিখি", "আমি তোমার সঙ্গে যাই"], "correct": 0}, {"q": "أنا بنام بدري বাক্যটি কী বোঝায়?", "opts": ["আমি দেরিতে আসি", "আমি তাড়াতাড়ি ঘুমাই", "আমি কাজ খুঁজি", "আমি পানি পান করি"], "correct": 1}, {"q": "إنتَ সর্বনামটি কাকে বোঝায়?", "opts": ["আমি", "সে (মেয়ে)", "তুমি (ছেলে)", "আমরা"], "correct": 2}, {"q": "إنتِ সর্বনামটি কাকে বোঝায়?", "opts": ["আপনারা", "তারা", "সে (ছেলে)", "তুমি (মেয়ে)"], "correct": 3}, {"q": "هو সর্বনামটির বাংলা অর্থ কী?", "opts": ["সে (ছেলে)", "আমরা", "তুমি (মেয়ে)", "তারা"], "correct": 0}, {"q": "هي সর্বনামটির অর্থ কী?", "opts": ["আপনারা", "সে (মেয়ে)", "আমি", "আমরা"], "correct": 1}, {"q": "إنتوا সর্বনামটি সাধারণত কাদের বোঝায়?", "opts": ["একজন ছেলে", "একজন মেয়ে", "আপনারা/তোমরা", "শুধু বক্তাকে"], "correct": 2}, {"q": "هم সর্বনামটির অর্থ কী?", "opts": ["আমরা", "আমি", "তুমি", "তারা"], "correct": 3}, {"q": "أنا সর্বনামের সঙ্গে পাঠে কাজ করি বোঝাতে কোন ক্রিয়ারূপ দেওয়া হয়েছে?", "opts": ["بشتغل", "بيشتغل", "بتشتغلي", "بنشتغل"], "correct": 0}, {"q": "إنتَ-এর সঙ্গে ‘তুমি কাজ করো’ বোঝাতে কোন রূপটি আছে?", "opts": ["بنشتغل", "بتشتغل", "بيشتغل", "بتشتغلوا"], "correct": 1}, {"q": "هو-এর সঙ্গে ‘সে কাজ করে’ বোঝাতে কোন রূপটি দেওয়া হয়েছে?", "opts": ["بشتغل", "بنشتغل", "بيشتغل", "بتشتغلوا"], "correct": 2}, {"q": "إحنا-এর সঙ্গে ‘আমরা কাজ করি’ বোঝাতে কোন রূপটি ব্যবহৃত হয়েছে?", "opts": ["بتشتغلي", "بيشتغل", "بشتغل", "بنشتغل"], "correct": 3}, {"q": "‘তুমি (মেয়ে) কাজ করো’—ক্রিয়ার শেষে কোন অংশটি দেখা যায়?", "opts": ["ي", "وا", "نا", "ش"], "correct": 0}, {"q": "‘আপনারা/তোমরা কাজ করেন’—কোন আরবি ক্রিয়ারূপটি পাঠে দেওয়া হয়েছে?", "opts": ["بشتغل", "بتشتغلوا", "بيشتغل", "بتشتغلي"], "correct": 1}, {"q": "‘তারা কাজ করে’—এর সঠিক ক্রিয়ারূপ কোনটি?", "opts": ["بنشتغل", "بتشتغل", "بيشتغلوا", "بشتغل"], "correct": 2}, {"q": "أنا بروح الشغل বাক্যটির অর্থ কী?", "opts": ["আমি কাজ করি না", "আমি কাজ লিখি", "আমি কাজ বুঝি", "আমি কাজে যাই"], "correct": 3}, {"q": "أنا بشرب مَيَّة বাক্যে مَيَّة শব্দের অর্থ কী?", "opts": ["পানি", "চা", "কফি", "রুটি"], "correct": 0}, {"q": "أنا بتكلم عربي বাক্যটির অর্থ কী?", "opts": ["আমি আরবি পড়ি", "আমি আরবি বলি", "আমি আরবি লিখি", "আমি আরবি বুঝি না"], "correct": 1}, {"q": "أنا بتعلم عربي বাক্যটির অর্থ কী?", "opts": ["আমি আরবি ভুলে যাই", "আমি আরবি বলি", "আমি আরবি শিখি", "আমি আরবি লিখি"], "correct": 2}, {"q": "أنا بقرأ كتاب বাক্যটির অর্থ কী?", "opts": ["আমি কাজে যাই", "আমি বার্তা লিখি", "আমি পানি খাই", "আমি বই পড়ি"], "correct": 3}, {"q": "أنا بكتب رسالة বাক্যে رسالة শব্দের অর্থ কী?", "opts": ["বার্তা/চিঠি", "বই", "কাজ", "বাজার"], "correct": 0}, {"q": "إنتَ بتروح الشغل বাক্যটির বাংলা অর্থ কী?", "opts": ["সে কাজে যায়", "তুমি কাজে যাও", "আমরা কাজে যাই", "তারা কাজে যায়"], "correct": 1}, {"q": "إنتَ بتفهم كلامي বাক্যটির অর্থ কী?", "opts": ["তুমি আমার কথা লেখো", "তুমি আমার কথা বলো", "তুমি আমার কথা বোঝো", "তুমি আমার কথা শোনো না"], "correct": 2}, {"q": "هو بيروح الشغل বাক্যটির অর্থ কী?", "opts": ["তুমি কাজে যাও", "আমি কাজে যাই", "আমরা কাজে যাই", "সে কাজে যায়"], "correct": 3}, {"q": "هو بيكتب رسالة বাক্যটির অর্থ কী?", "opts": ["সে একটি বার্তা লেখে", "সে বই পড়ে", "সে পানি পান করে", "সে ঘুমায়"], "correct": 0}, {"q": "إحنا بنروح الشغل বাক্যটির অর্থ কী?", "opts": ["তারা কাজে যায়", "আমরা কাজে যাই", "সে কাজে যায়", "আমি কাজে যাই"], "correct": 1}, {"q": "إحنا بنكتب رسايل বাক্যে رسايل শব্দটি কী বোঝায়?", "opts": ["বই", "পানি", "বার্তাগুলো/চিঠিগুলো", "কাজ"], "correct": 2}, {"q": "أنا بدوّر على شغل বাক্যটির বাংলা অর্থ কী?", "opts": ["আমি কাজে যাচ্ছি", "আমি কাজ করছি", "আমি কাজ ছেড়েছি", "আমি কাজ খুঁজছি"], "correct": 3}, {"q": "بتدوروا على عمال؟ প্রশ্নটির অর্থ কী?", "opts": ["আপনারা কি শ্রমিক খুঁজছেন?", "আপনারা কি কাজ করেন?", "আপনারা কোথায় যাচ্ছেন?", "আপনারা কি আরবি শিখছেন?"], "correct": 0}, {"q": "بتشتغلوا كام يوم؟ প্রশ্নটি কী জানতে চায়?", "opts": ["আপনারা কোথায় থাকেন?", "আপনারা কত দিন কাজ করেন?", "আপনারা কী খান?", "আপনারা কখন ঘুমান?"], "correct": 1}, {"q": "بشتغل এবং هشتغل-এর পার্থক্য কী?", "opts": ["দুটিই শুধু অতীত বোঝায়", "দুটির অর্থ একই", "بشتغل সাধারণ বর্তমান বোঝায়, هشتغل ভবিষ্যৎ বোঝাতে পারে", "بشتغل মানে কাজ করব, هشتغل মানে কাজ করি"], "correct": 2}, {"q": "পাঠের সহজ সূত্র অনুযায়ী ভবিষ্যৎ বোঝাতে কোন প্রারম্ভিক অক্ষরটি ব্যবহৃত হতে পারে?", "opts": ["ش", "بـ", "ما", "هـ"], "correct": 3}];
const letters=['A','B','C','D'];const selected=Array(questions.length).fill(null);const quiz=document.getElementById('quiz');
questions.forEach((q,i)=>{const card=document.createElement('section');card.className='q';const title=document.createElement('p');title.className='qt';title.textContent=(i+1)+'. '+q.q;card.append(title);const opts=document.createElement('div');opts.className='opts';const feedback=document.createElement('div');feedback.className='feedback';feedback.setAttribute('aria-live','polite');q.opts.forEach((answer,j)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.setAttribute('aria-pressed','false');const mark=document.createElement('span');mark.className='mark';const txt=document.createElement('span');txt.className='opttext';txt.textContent=letters[j]+'. '+answer;b.append(mark,txt);b.addEventListener('click',()=>{if(selected[i]!==null)return;selected[i]=j;opts.querySelectorAll('.opt').forEach((el,k)=>{el.classList.toggle('selected',k===j);el.classList.toggle('correct',k===q.correct);el.classList.toggle('wrong',k===j&&k!==q.correct);el.setAttribute('aria-pressed',String(k===j));el.querySelector('.mark').textContent=k===q.correct?'✓':(k===j?'✗':'');el.disabled=true});if(j===q.correct){feedback.className='feedback good';feedback.textContent='✓ সঠিক উত্তর!'}else{feedback.className='feedback bad';feedback.textContent='✗ ভুল উত্তর। সঠিক উত্তর: '+letters[q.correct]+'. '+q.opts[q.correct]}});opts.append(b)});card.append(opts,feedback);quiz.append(card)});
</script></body></html>
